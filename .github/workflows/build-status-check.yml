name: ✅Build Status Check
run-name: ✅Build Status Check (${{ github.base_ref }} branch)


defaults:
  run:
    shell: pwsh


on:
  pull_request:
    branches: [main]


jobs:
  build_vel_empty_status_check:
    name: VelaptorEmpty Proj Template Build Status Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "${{ vars.NET_SDK_VERSION }}"

      - name: List CSProj Files
        run: |
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Filter "*.csproj" | ForEach-Object { Write-Host $_.FullName };

      - name: Build Project
        run: |
          $projFilePath = "${{ github.workspace }}/VelaptorTemplates/Templates/VelaptorEmpty/VelaptorEmpty.csproj";
          dotnet build $projFilePath -c Release;

  build_vel_render_texture_status_check:
    name: VelaptorRenderTexture Proj Template Build Status Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "${{ vars.NET_SDK_VERSION }}"

      - name: Build Project
        run: |
          $projFilePath = "${{ github.workspace }}/VelaptorTemplates/Templates/VelaptorRenderTexture/VelaptorRenderTexture.csproj";
          dotnet build $projFilePath -c Release;
